name: veritrace
description: "VeriTrace - Scan. Verify. Trust."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^3.0.0
  go_router: ^17.5.0
  dio: ^5.11.1
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  pdf: ^3.13.1
  printing: ^5.15.1
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  intl: ^0.20.3
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon_foreground.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#ECEFF1"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 23
